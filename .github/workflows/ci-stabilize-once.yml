name: CI Stabilize Once

on:
  push:
    branches:
      - arch/09-unified-ci
    paths:
      - .github/workflows/ci-stabilize-once.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout writable branch
        uses: actions/checkout@v5
        with:
          ref: arch/09-unified-ci
          fetch-depth: 0

      - name: Generate exact-head unified workflow candidate
        shell: bash
        run: |
          mkdir -p .ci
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/unified-platform-validation.yml')
          text = source.read_text()
          expr = '$' + '{' + '{ github.event.pull_request.head.sha || github.sha ' + '}' + '}'

          text = text.replace(
              '      - uses: actions/checkout@v5\n',
              '      - name: Checkout exact head\n'
              '        uses: actions/checkout@v5\n'
              '        with:\n'
              f'          ref: {expr}\n'
          )
          text = text.replace(
              '      - name: Checkout exact head\n'
              '        uses: actions/checkout@v5\n'
              '        with:\n'
              '          fetch-depth: 0\n',
              '      - name: Checkout exact head\n'
              '        uses: actions/checkout@v5\n'
              '        with:\n'
              f'          ref: {expr}\n'
              '          fetch-depth: 0\n'
          )
          text = text.replace(
              '      - name: Dependency audit (prod, high+)\n'
              '        run: npm audit --omit=dev --audit-level=high\n',
              '      - name: Dependency audit (prod, high+)\n'
              '        run: node scripts/ci/audit-production.mjs\n'
          )

          marker = '      - run: npm ci --no-audit --no-fund\n'
          verify = (
              marker
              + '      - name: Verify Linux x64 optional native bindings\n'
              + "        if: runner.os == 'Linux'\n"
              + '        run: node scripts/ci/verify-platform-optionals.mjs\n'
          )
          text = text.replace(marker, verify)

          workspace_install = (
              '      - name: Install exact workspace dependencies\n'
              '        run: npm ci --no-audit --no-fund\n'
          )
          workspace_verify = (
              workspace_install
              + '      - name: Verify Linux x64 optional native bindings\n'
              + "        if: runner.os == 'Linux'\n"
              + '        run: node scripts/ci/verify-platform-optionals.mjs\n'
          )
          text = text.replace(workspace_install, workspace_verify)

          Path('.ci/unified-platform-validation.generated.yml').write_text(text)
          PY

          exact_count="$(grep -c 'github.event.pull_request.head.sha || github.sha' .ci/unified-platform-validation.generated.yml)"
          native_count="$(grep -c 'Verify Linux x64 optional native bindings' .ci/unified-platform-validation.generated.yml)"
          echo "exact-head checkout expressions: ${exact_count}"
          echo "native verifiers: ${native_count}"
          test "$exact_count" -ge 12
          test "$native_count" -ge 11
          grep -F 'run: node scripts/ci/audit-production.mjs' .ci/unified-platform-validation.generated.yml

      - name: Commit generated candidate
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .ci/unified-platform-validation.generated.yml
          git diff --cached --check
          git commit -m "ci: materialize unified workflow candidate"
          git push origin HEAD:arch/09-unified-ci
