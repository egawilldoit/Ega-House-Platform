name: CI Stabilize Once

on:
  push:
    branches:
      - arch/09-unified-ci
    paths:
      - .github/workflows/ci-stabilize-once.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: arch/09-unified-ci
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund

      - name: Map vulnerable production dependency ownership
        shell: bash
        run: |
          echo '=== versions ==='
          node - <<'NODE'
          for (const name of ['hono','ws','fast-uri','js-yaml','nanoid','image-size','ajv','react-native','react-native-reanimated','expo']) {
            try { console.log(name, require(`${name}/package.json`).version) } catch { console.log(name, 'not root-resolvable') }
          }
          NODE
          echo '=== dependency tree ==='
          npm ls hono ws fast-uri js-yaml nanoid image-size ajv react-native react-native-reanimated expo --all || true
          echo '=== explain ==='
          for p in hono ws fast-uri js-yaml nanoid image-size ajv react-native react-native-reanimated expo; do
            echo "--- $p ---"
            npm explain "$p" || true
          done
          echo '=== registry compatible/latest evidence ==='
          for p in hono ws fast-uri js-yaml nanoid ajv react-native-reanimated expo react-native; do
            echo "--- $p ---"
            npm view "$p" version dist-tags --json || true
          done
          echo '=== high/critical audit objects ==='
          npm audit --omit=dev --json > /tmp/audit.json || true
          node - <<'NODE'
          const a=require('/tmp/audit.json');
          for (const [name,v] of Object.entries(a.vulnerabilities||{})) {
            if (!['high','critical'].includes(v.severity)) continue;
            console.log(JSON.stringify({name,severity:v.severity,isDirect:v.isDirect,via:v.via,effects:v.effects,range:v.range,nodes:v.nodes,fixAvailable:v.fixAvailable}, null, 2));
          }
          NODE
