name: Public Signup CI

on:
  pull_request:
    branches: [main]
    paths:
      - "src/app/page.tsx"
      - "src/app/home/**"
      - "src/app/auth-ui/**"
      - "src/app/signup/**"
      - "src/app/auth/confirm/**"
      - "src/app/login/page.tsx"
      - "src/app/login/login-form.tsx"
      - "src/app/login/**/*.test.ts"
      - "src/app/login/**/*.test.tsx"
      - "src/lib/auth/**"
      - "package.json"
      - "package-lock.json"
      - "eslint.config.mjs"
      - ".github/workflows/public-signup-ci.yml"
  push:
    branches:
      - "feat/public-signup"
      - "feat/signup-discovery-ctas"
      - "feat/homepage-operational-studies"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund

      - name: Focused public surface tests
        run: >-
          npm test -- --run
          src/lib/auth/safe-redirect.test.ts
          src/app/auth-ui/auth-ui.test.ts
          src/app/home/home-page.test.ts
          src/app/login/login-form.test.ts
          src/app/login/__tests__/navigation-regression.test.tsx
          src/app/signup/signup-validation.test.ts
          src/app/signup/signup-form.test.ts
          src/app/signup/signup-discovery.test.ts
          src/app/auth/confirm/route.test.ts

      - name: Full regression suite
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint public homepage and auth files
        run: >-
          npx eslint
          src/lib/auth
          src/app/page.tsx
          src/app/auth-ui
          src/app/home
          src/app/signup
          src/app/auth/confirm
          src/app/login/page.tsx
          src/app/login/login-form.tsx

      - name: Build production application
        env:
          DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/postgres"
          MCP_ENABLED: "false"
          MCP_WRITES_ENABLED: "false"
          NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_ci_placeholder"
          NEXT_PUBLIC_SITE_URL: "https://example.com"
        run: npm run build
