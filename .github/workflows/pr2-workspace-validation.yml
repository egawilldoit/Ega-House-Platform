name: PR2 Workspace Validation

on:
  push:
    branches:
      - arch/02-npm-workspace-foundation
  pull_request:
    branches:
      - arch/01-baseline-guardrails

permissions:
  contents: read

env:
  PR2_BASE_SHA: d71d689d8801aaa03cfb4a7a2963f2dde0f8b437

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify committed PR2 diff hygiene
        run: |
          git diff --check "$PR2_BASE_SHA"...HEAD
          test -z "$(git status --porcelain)"

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Prove one authoritative platform workspace lockfile and pinned frameworks
        run: |
          test -f package-lock.json
          test -z "$(git ls-files 'apps/*/package-lock.json' 'packages/*/package-lock.json')"
          test -f scripts/ega-runner/package-lock.json
          node - <<'NODE'
          const root = require('./package.json');
          const mobile = require('./apps/mobile/package.json');
          const lock = require('./package-lock.json');
          if (JSON.stringify(root.workspaces) !== JSON.stringify(['apps/*', 'packages/*'])) throw new Error('unexpected root workspaces');
          if (mobile.name !== '@ega/mobile') throw new Error('unexpected mobile package name');
          if (mobile.dependencies.expo !== '~54.0.34') throw new Error('Expo version changed');
          if (mobile.dependencies.react !== '19.1.0') throw new Error('mobile React version changed');
          if (mobile.dependencies['react-native'] !== '0.81.5') throw new Error('React Native version changed');
          if (root.dependencies.next !== '16.2.12') throw new Error('Next version changed');
          if (root.dependencies.react !== '19.1.0' || root.dependencies['react-dom'] !== '19.1.0') throw new Error('root React singleton alignment is not pinned to 19.1.0');
          if (lock.packages?.['apps/mobile']?.name !== '@ega/mobile') throw new Error('root lock does not own the mobile workspace');
          if (lock.packages?.['']?.dependencies?.react !== '19.1.0' || lock.packages?.['']?.dependencies?.['react-dom'] !== '19.1.0') throw new Error('root lock does not record the justified React 19.1.0 alignment');
          NODE

      - name: Install exact root workspace dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit React and React Native resolution
        run: |
          npm ls react react-dom react-native
          npm why react-native
          npm why react
          node - <<'NODE'
          const { execFileSync } = require('node:child_process');
          const tree = JSON.parse(execFileSync('npm', ['ls', 'react-native', '--workspace', '@ega/mobile', '--json'], { encoding: 'utf8' }));
          const versions = new Set();
          function walk(node) {
            if (!node || typeof node !== 'object') return;
            const rn = node.dependencies?.['react-native'];
            if (rn?.version) versions.add(rn.version);
            for (const dep of Object.values(node.dependencies || {})) walk(dep);
          }
          walk(tree);
          if (versions.size !== 1 || !versions.has('0.81.5')) throw new Error(`mobile resolves unexpected React Native versions: ${[...versions].join(', ')}`);
          const reactVersion = require('./node_modules/react/package.json').version;
          const reactDomVersion = require('./node_modules/react-dom/package.json').version;
          if (reactVersion !== '19.1.0' || reactDomVersion !== '19.1.0') throw new Error(`workspace root resolves React ${reactVersion} / ReactDOM ${reactDomVersion}, expected 19.1.0`);
          NODE

      - name: Mobile doctor
        shell: bash
        run: |
          set +e
          npm run mobile:doctor 2>&1 | tee /tmp/expo-doctor.log
          doctor_status=${PIPESTATUS[0]}
          set -e
          if [ "$doctor_status" -ne 0 ]; then
            diagnostic="$(tail -n 40 /tmp/expo-doctor.log | tr '\n' ' ' | sed 's/%/%25/g')"
            echo "::error title=Expo Doctor diagnostics::$diagnostic"
            exit "$doctor_status"
          fi

      - name: Mobile typecheck
        run: npm run mobile:typecheck

      - name: Mobile tests
        run: npm run mobile:test

      - name: Mobile Android bundle validation
        run: npm run mobile:bundle

      - name: Architecture tests
        run: npm run test:architecture

      - name: Architecture current-tree check
        run: npm run check:architecture

      - name: Agent context regression
        run: npm run validate:agent-context

      - name: Runner typecheck regression
        run: npm run typecheck:ega-runner

      - name: Runner PR-loop regression
        run: npm run test:ega-runner-pr-loop

      - name: Root typecheck
        run: npm run typecheck

      - name: Root tests
        run: npm test

      - name: Root build
        env:
          DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/postgres"
          MCP_ENABLED: "false"
          MCP_WRITES_ENABLED: "false"
          NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_ci_placeholder"
          NEXT_PUBLIC_SITE_URL: "https://example.com"
        run: npm run build

      - name: Prove generated mobile outputs are not tracked
        run: |
          test -z "$(git ls-files 'apps/mobile/android/**' 'apps/mobile/ios/**' 'apps/mobile/.expo/ci-export/**' 'apps/mobile/artifacts/**')"

      - name: Report validation workspace mutations
        if: ${{ always() }}
        run: git status --short
