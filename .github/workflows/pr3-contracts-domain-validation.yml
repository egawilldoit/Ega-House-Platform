name: PR3 Contracts Domain Validation

on:
  push:
    branches:
      - arch/03-contracts-domain
  pull_request:
    branches:
      - arch/02-npm-workspace-foundation

permissions:
  contents: read

env:
  PR3_BASE_SHA: cf6ec0ac07d9f319aefa8ab4ccd05880203b069a

jobs:
  contracts-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify PR3 ancestry and diff hygiene
        shell: bash
        run: |
          test "$(git merge-base "$PR3_BASE_SHA" HEAD)" = "$PR3_BASE_SHA"
          git diff --check "$PR3_BASE_SHA"...HEAD
          test -z "$(git status --porcelain)"

      - name: Guard PR3 scope
        shell: bash
        run: |
          changed="$(git diff --name-only "$PR3_BASE_SHA"...HEAD)"
          printf '%s\n' "$changed"

          if printf '%s\n' "$changed" | grep -Eq '^(src/db/|drizzle/|src/db/schema\.ts$|src/db/mcp-schema\.ts$)'; then
            echo "PR3 must not modify DB schema or migrations." >&2
            exit 1
          fi

          if printf '%s\n' "$changed" | grep -Eq '^(src/lib/mcp/|src/lib/http/agent-|src/lib/services/agent-)'; then
            echo "PR3 must not modify Agent/MCP behavior files." >&2
            exit 1
          fi

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Prove workspace manifests and lock ownership
        run: |
          test -f package-lock.json
          test ! -f apps/mobile/package-lock.json
          node - <<'NODE'
          const root = require('./package.json');
          const mobile = require('./apps/mobile/package.json');
          const contracts = require('./packages/contracts/package.json');
          const domain = require('./packages/domain/package.json');
          const lock = require('./package-lock.json');

          if (contracts.name !== '@ega/contracts' || contracts.version !== '0.1.0') throw new Error('invalid contracts workspace identity');
          if (domain.name !== '@ega/domain' || domain.version !== '0.1.0') throw new Error('invalid domain workspace identity');
          if (JSON.stringify(contracts.dependencies || {}) !== JSON.stringify({ '@ega/domain': '0.1.0' })) throw new Error('contracts may depend only on @ega/domain');
          if (Object.keys(domain.dependencies || {}).length !== 0) throw new Error('domain must have zero runtime dependencies');
          if (root.dependencies?.['@ega/contracts'] !== '0.1.0' || root.dependencies?.['@ega/domain'] !== '0.1.0') throw new Error('root shared workspace dependencies missing');
          if (mobile.dependencies?.['@ega/contracts'] !== '0.1.0' || mobile.dependencies?.['@ega/domain'] !== '0.1.0') throw new Error('mobile shared workspace dependencies missing');
          if (mobile.dependencies?.expo !== '~54.0.34' || mobile.dependencies?.react !== '19.1.0' || mobile.dependencies?.['react-native'] !== '0.81.5') throw new Error('mobile framework pins changed');
          if (lock.packages?.['packages/contracts']?.name !== '@ega/contracts') throw new Error('lock missing contracts workspace');
          if (lock.packages?.['packages/contracts']?.dependencies?.['@ega/domain'] !== '0.1.0') throw new Error('lock missing contracts -> domain edge');
          if (lock.packages?.['packages/domain']?.name !== '@ega/domain') throw new Error('lock missing domain workspace');
          if (lock.packages?.['apps/mobile']?.dependencies?.['@ega/contracts'] !== '0.1.0' || lock.packages?.['apps/mobile']?.dependencies?.['@ega/domain'] !== '0.1.0') throw new Error('lock missing mobile shared workspace dependencies');
          NODE

      - name: Install exact workspace dependencies
        run: npm ci --no-audit --no-fund

      - name: Prove installed workspace resolution
        run: |
          node - <<'NODE'
          const path = require('node:path');
          const rootContracts = require.resolve('@ega/contracts');
          const rootDomain = require.resolve('@ega/domain');
          const mobileRoot = path.resolve('apps/mobile');
          const mobileContracts = require.resolve('@ega/contracts', { paths: [mobileRoot] });
          const mobileDomain = require.resolve('@ega/domain', { paths: [mobileRoot] });

          if (rootContracts !== mobileContracts) throw new Error(`contracts workspace duplicated: root=${rootContracts}, mobile=${mobileContracts}`);
          if (rootDomain !== mobileDomain) throw new Error(`domain workspace duplicated: root=${rootDomain}, mobile=${mobileDomain}`);
          if (!rootContracts.endsWith('/packages/contracts/src/index.ts')) throw new Error(`unexpected contracts entry: ${rootContracts}`);
          if (!rootDomain.endsWith('/packages/domain/src/index.ts')) throw new Error(`unexpected domain entry: ${rootDomain}`);
          NODE

      - name: Prove contracts and domain package purity
        run: |
          node - <<'NODE'
          const { execFileSync } = require('node:child_process');
          const fs = require('node:fs');

          const files = execFileSync('git', ['ls-files', 'packages/contracts/src/**/*.ts', 'packages/domain/src/**/*.ts'], { encoding: 'utf8' })
            .split(/\r?\n/)
            .filter(Boolean);
          const forbidden = [
            /@supabase\//,
            /from\s+["']react(?:["'/])/, 
            /from\s+["']react-native(?:["'/])/,
            /from\s+["']expo(?:["'/])/,
            /from\s+["']next(?:["'/])/,
            /drizzle/,
            /src\/db/,
            /from\s+["']node:/,
            /require\(["']node:/,
          ];

          for (const file of files) {
            const source = fs.readFileSync(file, 'utf8');
            for (const pattern of forbidden) {
              if (pattern.test(source)) throw new Error(`${file}: forbidden shared-package dependency matched ${pattern}`);
            }
          }

          const contractsFiles = files.filter((file) => file.startsWith('packages/contracts/'));
          for (const file of contractsFiles) {
            const source = fs.readFileSync(file, 'utf8');
            if (/mapUserToMobileAuthenticatedUser|Supabase.*User|\btype\s+User\b/.test(source)) {
              throw new Error(`${file}: Supabase user mapping leaked into contracts`);
            }
          }
          NODE

      - name: Prove compatibility files are not duplicate authorities
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const requiredImports = new Map([
            ['src/lib/contracts/mobile.ts', '@ega/contracts/mobile'],
            ['src/lib/contracts/agent.ts', '@ega/contracts/agent'],
            ['apps/mobile/types/auth.ts', '@ega/contracts/mobile'],
            ['apps/mobile/types/tasks.ts', '@ega/contracts/mobile'],
            ['apps/mobile/types/today.ts', '@ega/contracts/mobile'],
            ['src/lib/task-domain.ts', '@ega/domain'],
            ['src/lib/task-recurrence.ts', '@ega/domain'],
          ]);
          for (const [file, expected] of requiredImports) {
            const source = fs.readFileSync(file, 'utf8');
            if (!source.includes(expected)) throw new Error(`${file}: missing compatibility link to ${expected}`);
          }

          const legacyDtoFiles = [
            'src/lib/contracts/mobile.ts',
            'src/lib/contracts/agent.ts',
            'apps/mobile/types/auth.ts',
            'apps/mobile/types/tasks.ts',
            'apps/mobile/types/today.ts',
          ];
          const duplicate = /^export\s+type\s+(MobileTaskListItem|MobileTodayResponse|AgentTaskResponse|AgentTokenScopes)\s*=\s*\{/m;
          for (const file of legacyDtoFiles) {
            if (duplicate.test(fs.readFileSync(file, 'utf8'))) throw new Error(`${file}: legacy DTO definition still competes with shared contracts`);
          }
          NODE

      - name: Contracts typecheck
        run: npm run contracts:typecheck

      - name: Contracts tests
        run: npm run contracts:test

      - name: Domain typecheck
        run: npm run domain:typecheck

      - name: Domain tests
        run: npm run domain:test

      - name: Architecture fixture tests
        run: npm run test:architecture

      - name: Architecture current-tree check
        run: npm run check:architecture

      - name: Mobile doctor
        run: npm run mobile:doctor

      - name: Mobile typecheck
        run: npm run mobile:typecheck

      - name: Mobile tests
        run: npm run mobile:test

      - name: Mobile Android bundle
        run: npm run mobile:bundle

      - name: Agent context regression
        run: npm run validate:agent-context

      - name: Runner typecheck regression
        run: npm run typecheck:ega-runner

      - name: Runner PR-loop regression
        run: npm run test:ega-runner-pr-loop

      - name: Root typecheck
        run: npm run typecheck

      - name: Root tests
        run: npm test

      - name: Root production build
        env:
          DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/postgres"
          MCP_ENABLED: "false"
          MCP_WRITES_ENABLED: "false"
          NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_ci_placeholder"
          NEXT_PUBLIC_SITE_URL: "https://example.com"
        run: npm run build

      - name: Prove generated outputs remain untracked
        shell: bash
        run: |
          test -z "$(git ls-files 'apps/mobile/android/**' 'apps/mobile/ios/**' 'apps/mobile/.expo/ci-export/**' 'apps/mobile/artifacts/**')"

      - name: Report validation workspace mutations
        if: ${{ always() }}
        run: git status --short
