name: Sync MCP Lockfile
on:
  push:
    branches: ["feat/mcp-oauth-integration"]
    paths: ["package.json", ".github/workflows/sync-mcp-lockfile.yml"]
permissions:
  contents: write
jobs:
  sync-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mcp-oauth-integration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: |
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build(mcp): synchronize fully remediated lockfile"
          git push origin HEAD:feat/mcp-oauth-integration
