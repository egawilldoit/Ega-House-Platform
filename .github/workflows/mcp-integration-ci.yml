name: MCP Integration CI

on:
  pull_request:
    branches: [main]
    paths:
      - "src/lib/mcp/**"
      - "src/db/mcp-schema.ts"
      - "src/app/api/mcp/**"
      - "src/app/.well-known/**"
      - "src/app/oauth/**"
      - "drizzle/0037_mcp_oauth_foundation.sql"
      - "drizzle.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mcp-integration-ci.yml"
  push:
    branches:
      - "feat/mcp-oauth-integration"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Record lockfile drift
        run: |
          if npm ci --ignore-scripts --dry-run; then
            echo "package-lock.json is synchronized."
          else
            echo "::warning::package.json and package-lock.json are not synchronized on the base repository."
          fi

      - name: Install dependencies without rewriting lockfile
        run: npm install --package-lock=false --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint MCP integration files
        run: npx eslint src/lib/mcp src/db/mcp-schema.ts

      - name: Unit tests
        run: npm test -- --run src/lib/mcp
