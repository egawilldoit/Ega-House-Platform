name: Merge Parent Once

on:
  push:
    branches:
      - arch/07-web-app-workspace
    paths:
      - .github/workflows/merge-parent-once.yml

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout stage 7
        uses: actions/checkout@v5
        with:
          ref: arch/07-web-app-workspace
          fetch-depth: 0
      - name: Merge verified stage 6
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin arch/06-api-client:refs/remotes/origin/arch/06-api-client
          git merge --no-ff --no-edit origin/arch/06-api-client
          git push origin HEAD:arch/07-web-app-workspace
