name: Merge Parent Once

on:
  push:
    branches:
      - arch/05-hono-project-goal-transport
    paths:
      - .github/workflows/merge-parent-once.yml

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout stage 5
        uses: actions/checkout@v5
        with:
          ref: arch/05-hono-project-goal-transport
          fetch-depth: 0
      - name: Merge corrected stage 4 parent
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin arch/04-project-goal-application-core:refs/remotes/origin/arch/04-project-goal-application-core
          git merge --no-ff --no-edit origin/arch/04-project-goal-application-core
          git push origin HEAD:arch/05-hono-project-goal-transport
