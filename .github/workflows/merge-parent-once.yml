name: Merge Parent Once

on:
  push:
    branches:
      - arch/06-api-client
    paths:
      - .github/workflows/merge-parent-once.yml

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: arch/06-api-client
          fetch-depth: 0
      - name: Merge corrected stage 5 parent
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin arch/05-hono-project-goal-transport:refs/remotes/origin/arch/05-hono-project-goal-transport
          git merge --no-ff --no-edit origin/arch/05-hono-project-goal-transport
          git push origin HEAD:arch/06-api-client
