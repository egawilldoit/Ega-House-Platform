name: Merge Parent Once

on:
  push:
    branches:
      - arch/09-unified-ci
    paths:
      - .github/workflows/merge-parent-once.yml

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: arch/09-unified-ci
          fetch-depth: 0
      - name: Merge final stage 8 parent
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin arch/08-native-project-goal-ui:refs/remotes/origin/arch/08-native-project-goal-ui
          git merge --no-ff --no-edit origin/arch/08-native-project-goal-ui
          git push origin HEAD:arch/09-unified-ci
