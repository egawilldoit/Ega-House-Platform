name: Unified Platform Validation

# Force-full mode runs EVERY validation job regardless of changed paths.
# Two activation paths:
# 1. Manual: workflow_dispatch with input force_full=true
#    (`gh workflow run unified-platform-validation.yml --ref <ref> -f force_full=true`).
# 2. Automatic: any pull_request whose head branch starts with `release/full-matrix/`
#    behaves as force_full=true, giving an auditable exact-head full matrix through
#    normal PR flow even when API dispatch permissions are unavailable.
# Normal PR/push path filtering is unchanged.
on:
  pull_request:
    branches: [main, "arch/**", "wave/**"]
  push:
    branches: [main, "arch/**", "wave/**"]
  workflow_dispatch:
    inputs:
      force_full:
        description: "Run every validation job regardless of changed paths"
        type: boolean
        default: false

concurrency:
  group: unified-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/postgres"
  MCP_ENABLED: "false"
  MCP_WRITES_ENABLED: "false"
  NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_ci_placeholder"
  NEXT_PUBLIC_SITE_URL: "https://example.com"

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
      server: ${{ steps.filter.outputs.server }}
      api-client: ${{ steps.filter.outputs.api-client }}
      web: ${{ steps.filter.outputs.web }}
      db: ${{ steps.filter.outputs.db }}
      force_full: ${{ steps.force_full.outputs.force_full }}
    steps:
      - name: Resolve force-full mode
        id: force_full
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "${{ inputs.force_full }}" = "true" ]; then
            echo "force_full=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [[ "${{ github.head_ref }}" == release/full-matrix/* ]]; then
            echo "force_full=true" >> "$GITHUB_OUTPUT"
          else
            echo "force_full=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout exact head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            mobile:
              - 'apps/mobile/**'
              - 'packages/contracts/**'
              - 'packages/domain/**'
              - 'packages/api-client/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/**'
            server:
              - 'apps/server/**'
              - 'packages/contracts/**'
              - 'packages/domain/**'
              - 'packages/application/**'
              - 'packages/data-access/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/**'
            api-client:
              - 'packages/api-client/**'
              - 'packages/contracts/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/**'
            web:
              - 'apps/web/**'
              - 'src/**'
              - 'drizzle/**'
              - 'drizzle.config.ts'
              - 'packages/**'
              - 'apps/server/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/**'
            db:
              - 'drizzle/**'
              - 'src/db/**'
              - 'scripts/db/**'
              - '.github/workflows/**'
              - 'package.json'
              - 'package-lock.json'

  delivery-map:
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: EGA Feature Delivery Map
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          else
            BASE="HEAD~1"
            HEAD="HEAD"
          fi
          echo "Base: $BASE"
          echo "Head: $HEAD"
          node scripts/ci/feature-delivery-map.mjs --base "$BASE" --head "$HEAD" --summary | tee delivery-map.txt
          cat delivery-map.txt >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Android binary: NOT BUILT (binaries are generated only by Mobile Delivery)" >> "$GITHUB_STEP_SUMMARY"

  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Diff hygiene pre-install
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ -n "$GITHUB_EVENT_BEFORE" ] && [ "$GITHUB_EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            BASE="$GITHUB_EVENT_BEFORE"
          else
            BASE="HEAD~1"
          fi
          git diff --check "$BASE"...HEAD
          test -z "$(git status --porcelain)"
      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install exact workspace dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify Linux x64 optional native bindings
        if: runner.os == 'Linux'
        run: node scripts/ci/verify-platform-optionals.mjs
      - name: Prove workspace and lockfile integrity
        run: npm run ci:workspace
      - name: Audit framework resolution
        run: npm ls react react-dom react-native expo-router
      - name: Dependency audit high/critical policy
        run: node scripts/ci/audit-production.mjs
      - name: Prove package purity
        run: npm run ci:purity
      - name: Prove security invariants
        run: npm run ci:security
      - name: Architecture current-tree check
        run: npm run check:architecture
      - name: Architecture fixture tests
        run: npm run test:architecture

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - if: runner.os == 'Linux'
        run: node scripts/ci/verify-platform-optionals.mjs
      - run: npm run contracts:typecheck
      - run: npm run contracts:test

  domain:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - if: runner.os == 'Linux'
        run: node scripts/ci/verify-platform-optionals.mjs
      - run: npm run domain:typecheck
      - run: npm run domain:test

  application:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - if: runner.os == 'Linux'
        run: node scripts/ci/verify-platform-optionals.mjs
      - run: npm run application:typecheck
      - run: npm run application:test

  data-access:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - if: runner.os == 'Linux'
        run: node scripts/ci/verify-platform-optionals.mjs
      - run: npm run data-access:typecheck
      - run: npm run data-access:test

  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - if: runner.os == 'Linux'
        run: node scripts/ci/verify-platform-optionals.mjs
      - name: Agent context regression
        run: npm run validate:agent-context

  lint-changed:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - if: runner.os == 'Linux'
        run: node scripts/ci/verify-platform-optionals.mjs
      - name: Scoped lint regression vs captured baseline
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="origin/main"
          fi
          npm run lint:changed -- --base "$BASE"

  lint-report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - if: runner.os == 'Linux'
        run: node scripts/ci/verify-platform-optionals.mjs
      - name: Full-repo lint informational report
        run: npm run lint:report

  web:
    needs: [changes]
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.force_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - if: runner.os == 'Linux'
        run: node scripts/ci/verify-platform-optionals.mjs
      - name: Web typecheck
        run: npm run typecheck
      - name: Web tests
        run: npm test
      - name: Web production build
        run: npm run build

  mobile:
    needs: [changes]
    if: needs.changes.outputs.mobile == 'true' || needs.changes.outputs.force_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - if: runner.os == 'Linux'
        run: node scripts/ci/verify-platform-optionals.mjs
      - name: Mobile doctor
        run: npm run mobile:doctor
      - name: Mobile typecheck
        run: npm run mobile:typecheck
      - name: Mobile tests
        run: npm run mobile:test
      - name: Mobile Android bundle validation
        run: npm run mobile:bundle

  server:
    needs: [changes]
    if: needs.changes.outputs.server == 'true' || needs.changes.outputs.force_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - if: runner.os == 'Linux'
        run: node scripts/ci/verify-platform-optionals.mjs
      - name: Server validation
        if: hashFiles('apps/server/package.json') != ''
        run: |
          npm run server:typecheck
          npm run server:test

  api-client:
    needs: [changes]
    if: needs.changes.outputs.api-client == 'true' || needs.changes.outputs.force_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - if: runner.os == 'Linux'
        run: node scripts/ci/verify-platform-optionals.mjs
      - name: API client validation
        if: hashFiles('packages/api-client/package.json') != ''
        run: |
          npm run api-client:typecheck
          npm run api-client:test

  db-invariants:
    needs: [changes]
    if: needs.changes.outputs.db == 'true' || needs.changes.outputs.force_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ega_proof
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Prove task_sessions single-open invariant through the migration journal
        env:
          PROOF_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ega_proof
        run: node scripts/db/timer-invariant-verify.mjs --url "$PROOF_DATABASE_URL"

  hygiene:
    needs: [changes, workspace, contracts, domain, application, data-access, regressions, lint-changed, lint-report, web, mobile, server, api-client, db-invariants]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Guard against concealed dependency failures
        if: ${{ always() }}
        shell: bash
        run: |
          set -u
          status=0
          check() {
            local name="$1" result="$2"
            echo "$name=$result"
            case "$result" in
              failure|cancelled)
                echo "::error::hygiene cannot report success while dependency job '$name' concluded '$result'"
                status=1
                ;;
              skipped)
                if [ "${{ needs.changes.outputs.force_full }}" = "true" ]; then
                  echo "::error::force-full mode requires job '$name' to execute, but it was skipped"
                  status=1
                fi
                ;;
            esac
          }
          check changes       "${{ needs.changes.result }}"
          check workspace     "${{ needs.workspace.result }}"
          check contracts     "${{ needs.contracts.result }}"
          check domain        "${{ needs.domain.result }}"
          check application   "${{ needs.application.result }}"
          check data-access   "${{ needs.data-access.result }}"
          check regressions   "${{ needs.regressions.result }}"
          check lint-changed  "${{ needs.lint-changed.result }}"
          check lint-report   "${{ needs.lint-report.result }}"
          check web           "${{ needs.web.result }}"
          check mobile        "${{ needs.mobile.result }}"
          check server        "${{ needs.server.result }}"
          check api-client    "${{ needs.api-client.result }}"
          check db-invariants "${{ needs.db-invariants.result }}"
          exit $status
      - name: Diff hygiene final check
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
      - name: Prove generated outputs remain untracked
        shell: bash
        run: |
          test -z "$(git ls-files 'apps/mobile/android/**' 'apps/mobile/ios/**' 'apps/mobile/.expo/**' 'apps/mobile/artifacts/**' '.next/**' 'apps/web/.next/**' 'apps/server/dist/**' 'packages/api-client/dist/**')"
      - name: Report validation workspace mutations
        if: ${{ always() }}
        run: git status --short
