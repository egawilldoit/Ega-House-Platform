name: Slack PR Safe Merge Notification

# Setup:
# - Add repository secret SLACK_WEBHOOK_URL with Slack incoming webhook URL.
# - This workflow only notifies; it never auto-merges. Human Squash merge remains final gate.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  check_suite:
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to evaluate"
        required: true
        type: string
      force_notify:
        description: "Send test Slack notification even if gates are not satisfied"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: slack-pr-ready-${{ github.event.pull_request.head.ref || github.event.check_suite.head_branch || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read
  actions: read
  issues: write

jobs:
  notify:
    name: Notify Slack when PR is safe for manual merge
    runs-on: ubuntu-latest

    steps:
      - name: Evaluate PR readiness
        id: evaluate
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const eventName = context.eventName;
            const payload = context.payload;
            const marker = '<!-- slack-pr-ready-notified -->';
            const failConclusions = new Set([
              'action_required',
              'cancelled',
              'failure',
              'startup_failure',
              'stale',
              'timed_out',
            ]);
            const successConclusions = new Set(['success', 'neutral', 'skipped']);
            const optionalPassConclusions = new Set(['success']);
            const requiredOptionalChecks = [
              { key: 'macroscope', label: 'Macroscope', pattern: /macroscope/i },
              { key: 'vercel', label: 'Vercel', pattern: /vercel/i },
            ];
            const isWorkflowDispatch = eventName === 'workflow_dispatch';
            const forceNotify = isWorkflowDispatch && payload.inputs?.force_notify === 'true';

            const summary = {
              prNumber: 'unresolved',
              prUrl: 'unresolved',
              eventName,
              baseBranch: 'unresolved',
              headBranch: 'unresolved',
              draft: 'unresolved',
              prState: 'unresolved',
              completedChecksCount: 0,
              pendingChecksCount: 0,
              failedChecksCount: 0,
              completedStatusesCount: 0,
              pendingStatusesCount: 0,
              failedStatusesCount: 0,
              macroscope: 'missing',
              vercel: 'missing',
              decision: 'skip',
              skipReason: 'PR was not evaluated',
            };

            function checkState(label, matchingCheckRuns, matchingStatuses) {
              const detected = matchingCheckRuns.length > 0 || matchingStatuses.length > 0;
              const passed =
                matchingCheckRuns.some((run) =>
                  run.status === 'completed' && optionalPassConclusions.has(run.conclusion)
                ) ||
                matchingStatuses.some((status) => status.state === 'success');

              if (!detected) return `${label}: missing`;
              if (passed) return `${label}: detected/pass`;
              return `${label}: detected/not pass`;
            }

            async function writeSummary() {
              await core.summary
                .addHeading('Slack PR-ready decision')
                .addTable([
                  [{ data: 'Field', header: true }, { data: 'Value', header: true }],
                  ['PR number', String(summary.prNumber)],
                  ['PR URL', String(summary.prUrl)],
                  ['Event name', String(summary.eventName)],
                  ['Base branch', String(summary.baseBranch)],
                  ['Head branch', String(summary.headBranch)],
                  ['Draft', String(summary.draft)],
                  ['PR state', String(summary.prState)],
                  ['Completed checks count', String(summary.completedChecksCount)],
                  ['Pending checks count', String(summary.pendingChecksCount)],
                  ['Failed checks count', String(summary.failedChecksCount)],
                  ['Completed statuses count', String(summary.completedStatusesCount)],
                  ['Pending statuses count', String(summary.pendingStatusesCount)],
                  ['Failed statuses count', String(summary.failedStatusesCount)],
                  ['Macroscope', summary.macroscope],
                  ['Vercel', summary.vercel],
                  ['Decision', summary.decision],
                  ['Skip reason', summary.skipReason || 'none'],
                ])
                .write();
            }

            async function findOpenPrByHead(headBranch, headSha) {
              const { data: prs } = await github.rest.pulls.list({
                owner,
                repo,
                state: 'open',
                per_page: 100,
              });

              return prs.find((pr) =>
                pr.head.sha === headSha ||
                pr.head.ref === headBranch
              );
            }

            async function getPullRequest(pullNumber) {
              const { data: pr } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: pullNumber,
              });
              return pr;
            }

            let pr = null;

            if (eventName === 'pull_request') {
              const pullNumber = payload.pull_request?.number;
              if (pullNumber) {
                pr = await getPullRequest(pullNumber);
              }
            } else if (eventName === 'check_suite') {
              const suite = payload.check_suite;
              pr = suite.pull_requests?.find((candidate) => candidate.base?.ref === 'main') || null;
              if (!pr) {
                pr = await findOpenPrByHead(suite.head_branch, suite.head_sha);
              }
            } else if (isWorkflowDispatch) {
              const pullNumber = Number(payload.inputs?.pr_number);
              if (Number.isInteger(pullNumber) && pullNumber > 0) {
                pr = await getPullRequest(pullNumber);
              }
            }

            if (!pr) {
              summary.skipReason = `No matching PR found for ${eventName}`;
              core.info(summary.skipReason);
              core.setOutput('should_notify', 'false');
              core.setOutput('should_mark', 'false');
              await writeSummary();
              return;
            }

            if (!pr.head?.sha || !pr.html_url) {
              pr = await getPullRequest(pr.number);
            }

            summary.prNumber = pr.number;
            summary.prUrl = pr.html_url;
            summary.baseBranch = pr.base.ref;
            summary.headBranch = pr.head.ref;
            summary.draft = pr.draft ? 'yes' : 'no';
            summary.prState = pr.state;

            const skipReasons = [];
            if (pr.state !== 'open') skipReasons.push(`PR state is ${pr.state}`);
            if (pr.merged) skipReasons.push('PR is already merged');
            if (pr.draft) skipReasons.push('PR is draft');
            if (pr.base.ref !== 'main') skipReasons.push(`Base branch is ${pr.base.ref}`);

            const { data: checkRuns } = await github.rest.checks.listForRef({
              owner,
              repo,
              ref: pr.head.sha,
              per_page: 100,
            });

            const relevantCheckRuns = checkRuns.check_runs.filter((run) =>
              run.name !== 'Notify Slack when PR is safe for manual merge' &&
              run.name !== 'Slack PR Safe Merge Notification'
            );

            const failingChecks = relevantCheckRuns.filter((run) =>
              run.status === 'completed' && failConclusions.has(run.conclusion)
            );
            const passingChecks = relevantCheckRuns.filter((run) =>
              run.status === 'completed' && successConclusions.has(run.conclusion)
            );
            const pendingChecks = relevantCheckRuns.filter((run) =>
              run.status !== 'completed'
            );
            const completedChecks = relevantCheckRuns.filter((run) =>
              run.status === 'completed'
            );

            const { data: combinedStatus } = await github.rest.repos.getCombinedStatusForRef({
              owner,
              repo,
              ref: pr.head.sha,
            });

            const failingStatuses = combinedStatus.statuses.filter((status) =>
              ['error', 'failure'].includes(status.state)
            );
            const pendingStatuses = combinedStatus.statuses.filter((status) =>
              status.state === 'pending'
            );
            const passingStatuses = combinedStatus.statuses.filter((status) =>
              status.state === 'success'
            );
            const completedStatuses = combinedStatus.statuses.filter((status) =>
              status.state !== 'pending'
            );

            summary.completedChecksCount = completedChecks.length;
            summary.pendingChecksCount = pendingChecks.length;
            summary.failedChecksCount = failingChecks.length;
            summary.completedStatusesCount = completedStatuses.length;
            summary.pendingStatusesCount = pendingStatuses.length;
            summary.failedStatusesCount = failingStatuses.length;

            for (const requiredCheck of requiredOptionalChecks) {
              const matchingCheckRuns = relevantCheckRuns.filter((run) =>
                requiredCheck.pattern.test(run.name)
              );
              const matchingStatuses = combinedStatus.statuses.filter((status) =>
                requiredCheck.pattern.test(status.context)
              );
              const isPresent = matchingCheckRuns.length > 0 || matchingStatuses.length > 0;
              const hasPassingResult =
                matchingCheckRuns.some((run) =>
                  run.status === 'completed' && optionalPassConclusions.has(run.conclusion)
                ) ||
                matchingStatuses.some((status) => status.state === 'success');

              summary[requiredCheck.key] = checkState(
                requiredCheck.label,
                matchingCheckRuns,
                matchingStatuses
              );

              if (isPresent && !hasPassingResult) {
                skipReasons.push(`${requiredCheck.label} check is present but has not passed`);
              }
            }

            if (pendingChecks.length > 0 || pendingStatuses.length > 0) {
              if (eventName === 'pull_request') {
                skipReasons.push('checks still pending');
              } else {
                if (pendingChecks.length > 0) {
                  skipReasons.push(`Pending checks: ${pendingChecks.map((run) => run.name).join(', ')}`);
                }
                if (pendingStatuses.length > 0) {
                  skipReasons.push(`Pending statuses: ${pendingStatuses.map((status) => status.context).join(', ')}`);
                }
              }
            }
            if (failingChecks.length > 0) {
              skipReasons.push(`Failing checks: ${failingChecks.map((run) => run.name).join(', ')}`);
            }
            if (failingStatuses.length > 0) {
              skipReasons.push(`Failing statuses: ${failingStatuses.map((status) => status.context).join(', ')}`);
            }
            if (completedChecks.length + completedStatuses.length === 0) {
              skipReasons.push('No completed checks or statuses found');
            }

            const checksSummary = [
              `${passingChecks.length} passing checks`,
              `${passingStatuses.length} passing statuses`,
              `${pendingChecks.length} pending checks`,
              `${failingChecks.length} failing checks`,
              `${pendingStatuses.length} pending statuses`,
              `${failingStatuses.length} failing statuses`,
            ].join(', ');

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: pr.number,
              per_page: 100,
            });
            const markerExists = comments.some((comment) => comment.body?.includes(marker));
            if (markerExists && !forceNotify) {
              skipReasons.push('Slack safe-to-merge notification marker already exists');
            }

            const linearSource = `${pr.title}\n${pr.body || ''}\n${pr.head.ref}`;
            const linearMatch = linearSource.match(/EGA-[0-9]+/i);
            const linearId = linearMatch ? linearMatch[0].toUpperCase() : 'No Linear ID detected';
            const headlineId = linearMatch ? linearMatch[0].toUpperCase() : 'PR';

            let payloadForSlack = null;
            if (forceNotify) {
              payloadForSlack = {
                text: '🧪 TEST — Slack PR-ready notification wiring works',
                blocks: [
                  {
                    type: 'section',
                    text: {
                      type: 'mrkdwn',
                      text: '🧪 *TEST — Slack PR-ready notification wiring works*',
                    },
                  },
                  {
                    type: 'section',
                    fields: [
                      { type: 'mrkdwn', text: `*PR title:*\n${pr.title}` },
                      { type: 'mrkdwn', text: `*Author:*\n${pr.user.login}` },
                      { type: 'mrkdwn', text: `*Base branch:*\n${pr.base.ref}` },
                      { type: 'mrkdwn', text: `*Head branch:*\n${pr.head.ref}` },
                      { type: 'mrkdwn', text: `*Linear issue ID:*\n${linearId}` },
                      { type: 'mrkdwn', text: `*Checks summary:*\n${checksSummary}` },
                    ],
                  },
                  {
                    type: 'section',
                    text: {
                      type: 'mrkdwn',
                      text: `*PR URL:*\n${pr.html_url}\n_Normal gates were bypassed for this manual wiring test._`,
                    },
                  },
                ],
              };
              summary.decision = 'notify';
              summary.skipReason = 'force_notify test bypassed gates';
            } else if (skipReasons.length === 0) {
              payloadForSlack = {
                text: `✅ ${headlineId} is valid — safe to merge manually`,
                blocks: [
                  {
                    type: 'section',
                    text: {
                      type: 'mrkdwn',
                      text: `✅ *${headlineId} is valid — safe to merge manually*`,
                    },
                  },
                  {
                    type: 'section',
                    fields: [
                      { type: 'mrkdwn', text: `*PR title:*\n${pr.title}` },
                      { type: 'mrkdwn', text: `*Author:*\n${pr.user.login}` },
                      { type: 'mrkdwn', text: `*Base branch:*\n${pr.base.ref}` },
                      { type: 'mrkdwn', text: `*Head branch:*\n${pr.head.ref}` },
                      { type: 'mrkdwn', text: `*Linear issue ID:*\n${linearId}` },
                      { type: 'mrkdwn', text: `*Checks summary:*\n${checksSummary}` },
                    ],
                  },
                  {
                    type: 'section',
                    text: {
                      type: 'mrkdwn',
                      text: `*PR URL:*\n${pr.html_url}`,
                    },
                  },
                  {
                    type: 'context',
                    elements: [
                      {
                        type: 'mrkdwn',
                        text: 'Reminder: Human must click Squash merge manually.',
                      },
                    ],
                  },
                ],
              };
              summary.decision = 'notify';
              summary.skipReason = 'none';
            } else {
              summary.decision = 'skip';
              summary.skipReason = [...new Set(skipReasons)].join('; ');
              core.info(`Not notifying: ${summary.skipReason}`);
            }

            core.setOutput('should_notify', payloadForSlack ? 'true' : 'false');
            core.setOutput('should_mark', payloadForSlack && !forceNotify ? 'true' : 'false');
            core.setOutput('pr_number', String(pr.number));
            if (payloadForSlack) {
              core.setOutput('slack_payload', JSON.stringify(payloadForSlack));
            }

            await writeSummary();

      - name: Send Slack notification
        id: slack
        if: steps.evaluate.outputs.should_notify == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_PAYLOAD: ${{ steps.evaluate.outputs.slack_payload }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "Slack webhook configured: no" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::SLACK_WEBHOOK_URL repository secret is not configured; skipping Slack notification."
            echo "sent=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Slack webhook configured: yes" >> "$GITHUB_STEP_SUMMARY"

          response_code="$(curl --silent --show-error --output /tmp/slack-response.txt --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data "$SLACK_PAYLOAD" \
            "$SLACK_WEBHOOK_URL" || true)"

          if [ "$response_code" -lt 200 ] || [ "$response_code" -gt 299 ]; then
            echo "::warning::Slack notification failed with HTTP $response_code."
            echo "sent=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "sent=true" >> "$GITHUB_OUTPUT"

      - name: Mark PR as notified
        if: steps.slack.outputs.sent == 'true' && steps.evaluate.outputs.should_mark == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pullNumber = Number('${{ steps.evaluate.outputs.pr_number }}');

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pullNumber,
              body: '<!-- slack-pr-ready-notified -->\nSlack safe-to-merge notification sent.',
            });
