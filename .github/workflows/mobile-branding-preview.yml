name: Mobile Branding Preview APK

on:
  push:
    branches:
      - feat/mobile-ega-branding

permissions:
  contents: write

env:
  PRODUCTION_API: https://ega-api.egawilldoit.online

jobs:
  build-branding-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branding branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Normalize native branding assets
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow==11.3.0
          python <<'PY'
          from PIL import Image
          from pathlib import Path

          root = Path('apps/mobile/assets/images')

          icon = Image.open(root / 'icon.png').convert('RGB')
          icon = icon.resize((1024, 1024), Image.Resampling.LANCZOS)
          icon.save(root / 'icon.png', optimize=True, compress_level=9)

          mark = Image.open(root / 'splash-icon.png').convert('RGBA')
          alpha = mark.getchannel('A').point(lambda value: 0 if value < 8 else value)
          mark.putalpha(alpha)
          bbox = mark.getchannel('A').getbbox()
          if bbox is None:
              raise SystemExit('splash-icon.png has no visible pixels')
          mark = mark.crop(bbox)

          def centered_mark(max_size: int) -> Image.Image:
              ratio = min(max_size / mark.width, max_size / mark.height)
              resized = mark.resize(
                  (max(1, round(mark.width * ratio)), max(1, round(mark.height * ratio))),
                  Image.Resampling.LANCZOS,
              )
              canvas = Image.new('RGBA', (1024, 1024), (0, 0, 0, 0))
              canvas.alpha_composite(
                  resized,
                  ((1024 - resized.width) // 2, (1024 - resized.height) // 2),
              )
              return canvas

          centered_mark(900).save(root / 'splash-icon.png', optimize=True, compress_level=9)
          centered_mark(600).save(root / 'adaptive-icon.png', optimize=True, compress_level=9)
          PY

          git diff --check
          git status --short

      - name: Commit normalized branding assets
        id: asset_commit
        shell: bash
        run: |
          set -euo pipefail
          git add apps/mobile/assets/images/icon.png \
                  apps/mobile/assets/images/splash-icon.png \
                  apps/mobile/assets/images/adaptive-icon.png
          if git diff --cached --quiet; then
            echo "No asset normalization changes required"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(mobile): normalize EGA native branding assets"
            git push origin HEAD:feat/mobile-ega-branding
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify branding contract
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          mobile = Path('apps/mobile')
          expo = json.loads((mobile / 'app.json').read_text())['expo']
          assert expo['version'] == '1.0.5', expo['version']
          assert 'splash' not in expo, 'legacy expo.splash config must be removed'
          plugin = next(
              (item for item in expo['plugins'] if isinstance(item, list) and item[0] == 'expo-splash-screen'),
              None,
          )
          assert plugin is not None, 'expo-splash-screen plugin missing'
          options = plugin[1]
          assert options['backgroundColor'] == '#000000', options
          assert options['image'] == './assets/images/splash-icon.png', options
          assert options['imageWidth'] == 200, options
          assert expo['android']['adaptiveIcon']['backgroundColor'] == '#000000'

          for name in ('icon.png', 'splash-icon.png', 'adaptive-icon.png'):
              image = Image.open(mobile / 'assets/images' / name)
              assert image.size == (1024, 1024), (name, image.size)
          assert 'A' in Image.open(mobile / 'assets/images/splash-icon.png').convert('RGBA').mode
          assert Image.open(mobile / 'assets/images/splash-icon.png').convert('RGBA').getchannel('A').getextrema()[0] == 0
          assert Image.open(mobile / 'assets/images/adaptive-icon.png').convert('RGBA').getchannel('A').getextrema()[0] == 0
          print('branding contract PASS')
          PY

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install workspace dependencies
        run: npm ci --no-audit --no-fund

      - name: Mobile typecheck
        run: npm run mobile:typecheck

      - name: Mobile tests
        run: npm run mobile:test

      - name: Expo doctor
        run: npm run mobile:doctor

      - name: Android bundle validation
        env:
          EXPO_PUBLIC_API_BASE_URL: ${{ env.PRODUCTION_API }}
        run: npm run mobile:bundle

      - name: Generate Android native project
        working-directory: apps/mobile
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
          EXPO_NO_GIT_STATUS: '1'
          EXPO_PUBLIC_API_BASE_URL: ${{ env.PRODUCTION_API }}
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build release APK
        working-directory: apps/mobile/android
        env:
          CI: '1'
          NODE_ENV: production
          EXPO_NO_TELEMETRY: '1'
          EXPO_NO_GIT_STATUS: '1'
          EXPO_PUBLIC_API_BASE_URL: ${{ env.PRODUCTION_API }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a,x86_64 \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.jvmargs=-Xmx4g

      - name: Stage APK
        shell: bash
        run: |
          set -euo pipefail
          src="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -f "$src"
          mkdir -p dist-apk
          out="dist-apk/ega-house-1.0.5-${{ steps.asset_commit.outputs.short_sha }}-branding-preview.apk"
          cp "$src" "$out"
          sha256sum "$out" | tee "$out.sha256"
          ls -lh "$out"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ega-house-branding-preview-${{ steps.asset_commit.outputs.short_sha }}
          path: dist-apk/*
          if-no-files-found: error
          retention-days: 7
