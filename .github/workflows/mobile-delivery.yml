name: Mobile Delivery (Blacksmith build + GitHub launch smoke)

on:
  workflow_dispatch:
  push:
    tags:
      - "mobile-v*.*.*"
      - "mobile-v*.*.*-rc.*"

concurrency:
  group: mobile-delivery-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PRODUCTION_API: https://ega-api.egawilldoit.online

jobs:
  preflight:
    name: Preflight (GitHub)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
      source_ref: ${{ steps.identity.outputs.source_ref }}
      app_version: ${{ steps.identity.outputs.app_version }}
      api_base_url: ${{ steps.identity.outputs.api_base_url }}
      is_tag: ${{ steps.identity.outputs.is_tag }}
      is_rc: ${{ steps.identity.outputs.is_rc }}
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Determine source identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="${{ github.sha }}"
          SOURCE_REF="${{ github.ref }}"
          echo "repository=egawilldoit/Ega-House-Platform"
          echo "source_sha=$SOURCE_SHA"
          echo "source_ref=$SOURCE_REF"

          APP_VERSION="$(node -p "require('./apps/mobile/app.json').expo.version" 2>/dev/null || node -p "require('./apps/mobile/package.json').version" 2>/dev/null || echo "0.0.0")"
          if [[ "$SOURCE_REF" =~ refs/tags/mobile-v([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            APP_VERSION="${BASH_REMATCH[1]}"
          fi

          API_BASE_URL="https://ega-api.egawilldoit.online"
          IS_TAG="false"
          IS_RC="false"
          if [[ "$SOURCE_REF" == refs/tags/mobile-v* ]]; then
            IS_TAG="true"
            if [[ "$SOURCE_REF" == *"-rc."* ]]; then
              IS_RC="true"
            fi
          fi

          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "source_ref=$SOURCE_REF" >> "$GITHUB_OUTPUT"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "api_base_url=$API_BASE_URL" >> "$GITHUB_OUTPUT"
          echo "is_tag=$IS_TAG" >> "$GITHUB_OUTPUT"
          echo "is_rc=$IS_RC" >> "$GITHUB_OUTPUT"

          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Mobile Delivery Preflight
          - Repository: egawilldoit/Ega-House-Platform
          - SOURCE_SHA: \`$SOURCE_SHA\`
          - SOURCE_REF: \`$SOURCE_REF\`
          - APP_VERSION: \`$APP_VERSION\`
          - API_BASE_URL: \`$API_BASE_URL\`
          EOF

      - name: Enforce native version bump if native changes (appVersion policy)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE_SHA="${{ steps.identity.outputs.source_sha }}"
          CANDIDATE_VER="$(node -p "require('./apps/mobile/app.json').expo.version")"
          echo "Candidate SHA: $CANDIDATE_SHA"
          echo "Candidate version (app.json): $CANDIDATE_VER"
          # Fetch latest stable baseline manifest (if any)
          BASELINE_URL=""
          if gh api repos/${{ github.repository }}/releases/latest --jq '.assets[] | select(.name=="release-manifest.json") | .browser_download_url' > /tmp/baseline_url.txt 2>/dev/null; then
            BASELINE_URL="$(cat /tmp/baseline_url.txt | head -n1)"
          fi
          if [ -z "$BASELINE_URL" ]; then
            echo "No baseline manifest asset found — bootstrap first native release, allowing $CANDIDATE_VER"
            echo "If this is not the intended bootstrap (1.0.1), ensure a stable release-manifest.json exists"
            exit 0
          fi
          echo "Baseline manifest URL: $BASELINE_URL"
          if ! curl -fsSL -H "Accept: application/json" -H "Authorization: Bearer $GH_TOKEN" "$BASELINE_URL" -o /tmp/baseline-manifest.json; then
            echo "::error::Failed to fetch baseline manifest from $BASELINE_URL"
            exit 1
          fi
          cat /tmp/baseline-manifest.json
          BASELINE_VER="$(jq -r .version /tmp/baseline-manifest.json)"
          BASELINE_SHA="$(jq -r .gitSha /tmp/baseline-manifest.json)"
          BASELINE_RT="$(jq -r .runtimeVersion /tmp/baseline-manifest.json)"
          echo "Baseline version: $BASELINE_VER runtime: $BASELINE_RT sha: $BASELINE_SHA"
          if [ -z "$BASELINE_VER" ] || [ "$BASELINE_VER" = "null" ] || [ -z "$BASELINE_SHA" ] || [ "$BASELINE_SHA" = "null" ]; then
            echo "::error::Malformed baseline manifest — missing version/gitSha — fail closed"
            cat /tmp/baseline-manifest.json
            exit 1
          fi
          # Strict semver compare via helper; allow JS-only same version, block native diff without bump
          node scripts/ci/check-native-version-bump.mjs \
            --baseline-manifest /tmp/baseline-manifest.json \
            --candidate-version "$CANDIDATE_VER" \
            --base "$BASELINE_SHA" \
            --head "$CANDIDATE_SHA"

      - name: Validate source ref is main or mobile-v* tag
        shell: bash
        run: |
          set -euo pipefail
          REF="${{ steps.identity.outputs.source_ref }}"
          if [[ "$REF" == "refs/heads/main" ]]; then
            echo "Source is main — allowed."
          elif [[ "$REF" == refs/tags/mobile-v* ]]; then
            echo "Source is mobile tag — allowed."
            TAG="${REF#refs/tags/}"
            TAG_SHA="$(git rev-list -n 1 "$TAG" 2>/dev/null || echo "")"
            HEAD_SHA="$(git rev-parse HEAD)"
            echo "Tag $TAG points to $TAG_SHA, HEAD is $HEAD_SHA"
            if [ "$TAG_SHA" != "$HEAD_SHA" ]; then
              echo "::error::Tag $TAG does not point to HEAD $HEAD_SHA (points to $TAG_SHA)"
              exit 1
            fi
          else
            echo "::error::Source $REF is not refs/heads/main nor refs/tags/mobile-v* — failing before Blacksmith"
            exit 1
          fi

      - name: Verify Unified Platform Validation is green for exact SOURCE_SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SHA="${{ steps.identity.outputs.source_sha }}"
          echo "Checking Unified Platform Validation for exact SHA $SHA (single check)"
          SUCCESS="$(gh api "repos/${{ github.repository }}/actions/workflows/unified-platform-validation.yml/runs?per_page=20" --jq "[.workflow_runs[] | select(.head_sha==\"$SHA\" and .conclusion==\"success\" and .status==\"completed\")] | length" 2>/dev/null || echo "0")"
          echo "Successful runs for $SHA: $SUCCESS"
          if [ "$SUCCESS" -eq 0 ]; then
            echo "::error::BLOCKED_CI_NOT_GREEN: No successful Unified Platform Validation for exact SOURCE_SHA $SHA. Wait for Unified CI to finish and be green before dispatching Mobile Delivery."
            gh api "repos/${{ github.repository }}/actions/workflows/unified-platform-validation.yml/runs?per_page=5" --jq ".workflow_runs[] | \"\(.head_sha) \(.status) \(.conclusion)\"" || true
            exit 1
          fi
          echo "Unified CI is green for $SHA"

  build-apk:
    name: Build APK (Blacksmith)
    needs: [preflight]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 40
    outputs:
      apk_filename: ${{ steps.manifest.outputs.apk_filename }}
      apk_sha256: ${{ steps.manifest.outputs.apk_sha256 }}
      app_version: ${{ needs.preflight.outputs.app_version }}
      source_sha: ${{ needs.preflight.outputs.source_sha }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_url: ${{ steps.upload.outputs.artifact-url }}
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          fetch-depth: 1

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK (minimal)
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Install workspace dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Android native project (Expo prebuild)
        working-directory: apps/mobile
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
          EXPO_NO_GIT_STATUS: "1"
          EXPO_PUBLIC_API_BASE_URL: ${{ needs.preflight.outputs.api_base_url }}
        run: npx expo prebuild --platform android --clean --no-install

      - name: Setup Gradle cache (Blacksmith-compatible)
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY || '' }}
          cache-read-only: ${{ needs.preflight.outputs.is_tag == 'true' }}

      - name: Build APK (single, arm64-v8a + x86_64 only)
        working-directory: apps/mobile/android
        env:
          CI: "1"
          NODE_ENV: production
          EXPO_NO_TELEMETRY: "1"
          EXPO_NO_GIT_STATUS: "1"
          EXPO_PUBLIC_API_BASE_URL: ${{ needs.preflight.outputs.api_base_url }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          echo "Building release APK for arm64-v8a,x86_64 (sideload, not Play Store universal)"
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a,x86_64 \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.jvmargs=-Xmx4g

      - name: Verify production API URL embedded in APK bundle
        shell: bash
        run: |
          set -euo pipefail
          APK_SRC="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          BUNDLE_ENTRY="$(unzip -l "$APK_SRC" | awk '{print $4}' | grep -E '(^assets/)?index\.android\.bundle$' | head -n 1 || true)"
          if [ -z "$BUNDLE_ENTRY" ]; then
            BUNDLE_ENTRY="$(unzip -l "$APK_SRC" | awk '{print $4}' | grep '\.bundle$' | head -n 1 || true)"
          fi
          if [ -z "$BUNDLE_ENTRY" ]; then
            echo "::warning::No JS bundle entry found inside APK; skipping supplemental URL check"
            exit 0
          fi
          echo "Inspecting bundle entry: $BUNDLE_ENTRY"
          if unzip -p "$APK_SRC" "$BUNDLE_ENTRY" | grep -qF "https://ega-api.egawilldoit.online"; then
            echo "Production API URL literal found in $BUNDLE_ENTRY (supplemental evidence only)"
          else
            echo "::error::Production API URL https://ega-api.egawilldoit.online NOT found in embedded bundle $BUNDLE_ENTRY — build-time env inlining failed"
            exit 1
          fi

      - name: Create APK identity (manifest + checksum)
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.preflight.outputs.app_version }}"
          SHORT_SHA="$(echo "${{ needs.preflight.outputs.source_sha }}" | cut -c1-7)"
          APK_SRC="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_SRC" ]; then
            echo "::error::Expected release APK not found at $APK_SRC"
            find apps/mobile/android/app/build/outputs -type f 2>/dev/null | head -n 20 || true
            exit 1
          fi
          echo "Found APK: $APK_SRC"
          ls -lh "$APK_SRC"

          APK_FILENAME="ega-house-${VERSION}-${SHORT_SHA}-release.apk"
          mkdir -p dist-apk
          cp "$APK_SRC" "dist-apk/${APK_FILENAME}"
          APK_SHA256="$(sha256sum "dist-apk/${APK_FILENAME}" | awk '{print $1}')"
          echo "APK_SHA256=$APK_SHA256"
          echo "APK_FILENAME=$APK_FILENAME"

          BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Extract actual embedded runtimeVersion from generated native config (appVersion policy)
          APP_JSON_VERSION="$(node -p "require('./apps/mobile/app.json').expo.version")"
          if [ "$APP_JSON_VERSION" != "$VERSION" ]; then
            echo "::error::APK version mismatch: app.json $APP_JSON_VERSION != preflight $VERSION"
            exit 1
          fi
          STRINGS_XML="apps/mobile/android/app/src/main/res/values/strings.xml"
          ANDROID_MANIFEST="apps/mobile/android/app/src/main/AndroidManifest.xml"
          if [ ! -f "$STRINGS_XML" ]; then
            echo "::error::Missing strings.xml at $STRINGS_XML — prebuild did not run"
            exit 1
          fi
          if [ ! -f "$ANDROID_MANIFEST" ]; then
            echo "::error::Missing AndroidManifest.xml at $ANDROID_MANIFEST"
            exit 1
          fi
          EMBEDDED_RUNTIME="$(grep -oP '(?<=<string name="expo_runtime_version">)[^<]+' "$STRINGS_XML" | head -n1 | tr -d '\r' || echo "")"
          if [ -z "$EMBEDDED_RUNTIME" ]; then
            echo "::error::Failed to extract expo_runtime_version from $STRINGS_XML"
            cat "$STRINGS_XML"
            exit 1
          fi
          echo "Embedded runtimeVersion: $EMBEDDED_RUNTIME"
          echo "App.json version: $APP_JSON_VERSION"
          if [ "$EMBEDDED_RUNTIME" != "$APP_JSON_VERSION" ]; then
            echo "::error::FAIL BUILD: embeddedRuntimeVersion ($EMBEDDED_RUNTIME) != app.json expo.version ($APP_JSON_VERSION) — appVersion policy requires equality"
            exit 1
          fi
          EMBEDDED_URL="$(grep -oP 'EXPO_UPDATE_URL.*?value="\K[^"]+' "$ANDROID_MANIFEST" | head -n1 || echo "")"
          EXPECTED_URL="https://u.expo.dev/73d127b6-c8f6-450c-8d97-2dca8434cd59"
          if [ "$EMBEDDED_URL" != "$EXPECTED_URL" ]; then
            echo "::error::EXPO_UPDATE_URL mismatch: got $EMBEDDED_URL expected $EXPECTED_URL"
            grep -n "EXPO_UPDATE" "$ANDROID_MANIFEST" || true
            exit 1
          fi
          echo "EXPO_UPDATE_URL OK: $EMBEDDED_URL"
          CHANNEL_HEADER="$(grep -o '"expo-channel-name":"production"' "$ANDROID_MANIFEST" || echo "")"
          if [ -z "$CHANNEL_HEADER" ]; then
            echo "::error::expo-channel-name=production not found in AndroidManifest"
            grep -n "UPDATES_CONFIGURATION_REQUEST_HEADERS" "$ANDROID_MANIFEST" || true
            cat "$ANDROID_MANIFEST" | grep -A2 -B2 "updates" || true
            exit 1
          fi
          echo "Channel header OK: production"
          cat > dist-apk/release-manifest.json <<EOF
          {
            "repository": "egawilldoit/Ega-House-Platform",
            "gitSha": "${{ needs.preflight.outputs.source_sha }}",
            "gitRef": "${{ needs.preflight.outputs.source_ref }}",
            "version": "$APP_JSON_VERSION",
            "variant": "release",
            "androidPackage": "com.ega_house.mobile",
            "apiBaseUrl": "${{ needs.preflight.outputs.api_base_url }}",
            "builtAt": "$BUILT_AT",
            "runner": "blacksmith-2vcpu-ubuntu-2404",
            "architectures": ["arm64-v8a", "x86_64"],
            "apkFile": "$APK_FILENAME",
            "apkSha256": "$APK_SHA256",
            "runtimeVersion": "$EMBEDDED_RUNTIME",
            "channel": "production"
          }
          EOF
          cat dist-apk/release-manifest.json
          echo "$APK_SHA256  $APK_FILENAME" > dist-apk/SHA256SUMS
          cat dist-apk/SHA256SUMS
          (cd dist-apk && sha256sum -c SHA256SUMS)

          echo "apk_filename=$APK_FILENAME" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"

          cat <<EOS >> "$GITHUB_STEP_SUMMARY"
          ## Blacksmith Build
          - Runner: blacksmith-2vcpu-ubuntu-2404
          - Architectures: arm64-v8a,x86_64 (sideload; not Play Store universal)
          - APK: \`$APK_FILENAME\`
          - SHA256: \`$APK_SHA256\`
          - Variant: release
          - Source SHA: \`${{ needs.preflight.outputs.source_sha }}\`
          EOS

      - name: Upload exact APK artifact (temporary, 1 day)
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ega-house-apk-${{ needs.preflight.outputs.source_sha }}
          path: dist-apk/**
          if-no-files-found: error
          retention-days: 1

  launch-smoke:
    name: Android launch smoke (GitHub)
    needs: [preflight, build-apk]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      apk_sha256: ${{ steps.verify.outputs.apk_sha256 }}
    steps:
      - name: Download exact APK artifact (Blacksmith)
        uses: actions/download-artifact@v4
        with:
          name: ega-house-apk-${{ needs.preflight.outputs.source_sha }}
          path: apk-dist

      - name: Verify checksum and manifest (no Node)
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          ls -lh apk-dist/
          cat apk-dist/release-manifest.json
          cat apk-dist/SHA256SUMS
          (cd apk-dist && sha256sum -c SHA256SUMS)

          APK_PATH="$(ls apk-dist/*.apk | head -n 1)"
          MANIFEST_SHA="$(jq -r .apkSha256 apk-dist/release-manifest.json)"
          FILE_SHA="$(sha256sum "$APK_PATH" | awk '{print $1}')"
          MANIFEST_GITSHA="$(jq -r .gitSha apk-dist/release-manifest.json)"
          MANIFEST_PKG="$(jq -r .androidPackage apk-dist/release-manifest.json)"
          MANIFEST_API="$(jq -r .apiBaseUrl apk-dist/release-manifest.json)"
          MANIFEST_ARCH="$(jq -r '.architectures | join(",")' apk-dist/release-manifest.json)"

          echo "Manifest gitSha: $MANIFEST_GITSHA"
          echo "Expected SHA: ${{ needs.preflight.outputs.source_sha }}"
          if [ "$MANIFEST_GITSHA" != "${{ needs.preflight.outputs.source_sha }}" ]; then
            echo "::error::manifest gitSha mismatch"
            exit 1
          fi

          echo "Manifest apkSha256: $MANIFEST_SHA"
          echo "File SHA256: $FILE_SHA"
          if [ "$MANIFEST_SHA" != "$FILE_SHA" ]; then
            echo "::error::FAIL_ARTIFACT_INTEGRITY: checksum mismatch"
            exit 1
          fi

          if [ "$MANIFEST_PKG" != "com.ega_house.mobile" ]; then
            echo "::error::manifest androidPackage expected com.ega_house.mobile, got $MANIFEST_PKG"
            exit 1
          fi

          if [ "$MANIFEST_API" != "https://ega-api.egawilldoit.online" ]; then
            echo "::error::manifest apiBaseUrl mismatch"
            exit 1
          fi

          if [ "$MANIFEST_ARCH" != "arm64-v8a,x86_64" ]; then
            echo "::error::manifest architectures expected arm64-v8a,x86_64, got $MANIFEST_ARCH"
            exit 1
          fi

          echo "apk_sha256=$FILE_SHA" >> "$GITHUB_OUTPUT"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          echo "APK ready at $APK_PATH"

      - name: Enable KVM access for hardware-accelerated emulation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node:kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger
          if [ ! -w /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
          fi
          ls -l /dev/kvm || true

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK inventory
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || true
          ls -d "$ANDROID_HOME"/system-images/*/*/* 2>/dev/null || echo "none preinstalled"

      - name: Ensure google_apis x86_64 system image
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          IMAGE_DIR="$(ls -d "$ANDROID_HOME"/system-images/android-*/google_apis/x86_64 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$IMAGE_DIR" ]; then
            echo "No google_apis x86_64 image preinstalled; installing android-34."
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" --install "system-images;android-34;google_apis;x86_64"
            IMAGE_DIR="$ANDROID_HOME/system-images/android-34/google_apis/x86_64"
          fi
          test -d "$IMAGE_DIR" || { echo "::error::system image missing at $IMAGE_DIR"; exit 1; }
          PKG="${IMAGE_DIR#"$ANDROID_HOME/system-images/"}"
          PKG="${PKG//\//;}"
          echo "AVD image package: $PKG"

      - name: Verify KVM acceleration (after emulator install)
        run: |
          "$ANDROID_HOME/emulator/emulator" -accel-check

      - name: Create AVD (lean, launch-only)
        run: |
          AVD_HOME="$GITHUB_WORKSPACE/.android/avd"
          mkdir -p "$AVD_HOME/ega-runtime.avd"
          cat > "$AVD_HOME/ega-runtime.ini" <<EOF
          avd.ini.encoding=UTF-8
          path=$AVD_HOME/ega-runtime.avd
          path.rel=avd/ega-runtime.avd
          target=android-34
          EOF
          cat > "$AVD_HOME/ega-runtime.avd/config.ini" <<EOF
          avd.ini.encoding=UTF-8
          AvdId=ega-runtime
          image.sysdir.1=system-images/android-34/google_apis/x86_64/
          tag.id=google_apis
          tag.display=Google APIs
          abi.type=x86_64
          hw.cpu.arch=x86_64
          hw.cpu.ncore=2
          hw.ramSize=2048
          hw.keyboard=yes
          hw.gpu.enabled=yes
          hw.gpu.mode=swiftshader_indirect
          hw.lcd.width=720
          hw.lcd.height=1280
          hw.lcd.density=320
          disk.dataPartition.size=2G
          image.androidVersion.api=34
          EOF
          echo "ANDROID_AVD_HOME=$AVD_HOME" >> "$GITHUB_ENV"

      - name: Launch emulator and wait for boot (bounded 6m)
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          EMU="$ANDROID_HOME/emulator/emulator"
          "$ADB" start-server
          nohup "$EMU" -avd ega-runtime \
            -no-window -no-audio -gpu swiftshader_indirect \
            -no-snapshot -no-boot-anim \
            > emulator.log 2>&1 &
          timeout 360 "$ADB" wait-for-device
          BOOTED=0
          for i in $(seq 1 36); do
            STATE="$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            if [ "$STATE" = "1" ]; then
              echo "Emulator booted (check #$i)."
              BOOTED=1
              break
            fi
            sleep 10
          done
          if [ "$BOOTED" != "1" ]; then
            echo "::error::FAIL_RUNTIME_PROOF: emulator did not report sys.boot_completed=1 within 6 minutes"
            tail -100 emulator.log || true
            exit 1
          fi
          "$ADB" devices

      - name: Android launch smoke (install + launch + pidof)
        shell: bash
        run: |
          set -euo pipefail
          ADB="$ANDROID_HOME/platform-tools/adb"
          APK="${{ env.APK_PATH }}"
          PKG="com.ega_house.mobile"
          echo "APK: $APK"
          echo "PKG: $PKG"
          echo "Installing exact APK..."
          "$ADB" install -r "$APK"

          COMPONENT="$("$ADB" shell cmd package resolve-activity --brief -a android.intent.action.MAIN -c android.intent.category.LAUNCHER "$PKG" | tr -d '\r' | tail -n 1)"
          echo "Launcher component: $COMPONENT"
          if [ -z "$COMPONENT" ]; then
            echo "::error::Failed to resolve launcher activity for $PKG"
            exit 1
          fi

          "$ADB" logcat -c || true

          echo "Launching $COMPONENT..."
          "$ADB" shell am start -W -n "$COMPONENT"

          echo "Waiting 10s for liveness..."
          sleep 10

          PID="$("$ADB" shell pidof "$PKG" | tr -d '\r' || true)"
          echo "PID after 10s: '$PID'"
          if [ -z "$PID" ]; then
            echo "::error::ANDROID LAUNCH SMOKE = FAIL — pidof $PKG empty after 10s (app crashed)"
            echo "--- logcat ---"
            "$ADB" logcat -d | tail -n 300 || true
            echo "--- emulator.log tail ---"
            tail -n 200 emulator.log || true
            exit 1
          fi
          echo "ANDROID LAUNCH SMOKE = PASS (pid $PID alive after 10s)"

      - name: Collect failure diagnostics (only on failure)
        if: failure()
        shell: bash
        run: |
          mkdir -p failure-diagnostics
          "$ANDROID_HOME/platform-tools/adb" logcat -d > failure-diagnostics/launch-failure-logcat.txt 2>&1 || true
          cp emulator.log failure-diagnostics/emulator.log 2>&1 || true
          ls -lh failure-diagnostics/

      - name: Upload failure diagnostics (1 day, failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: launch-smoke-failure-${{ needs.preflight.outputs.source_sha }}
          path: failure-diagnostics/**
          if-no-files-found: warn
          retention-days: 1

  publish-release:
    name: Publish GitHub Release (tag only)
    needs: [preflight, build-apk, launch-smoke]
    if: ${{ needs.preflight.outputs.is_tag == 'true' && needs.launch-smoke.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download exact APK artifact
        uses: actions/download-artifact@v4
        with:
          name: ega-house-apk-${{ needs.preflight.outputs.source_sha }}
          path: apk-dist

      - name: Verify checksum before release
        shell: bash
        run: |
          set -euo pipefail
          cat apk-dist/release-manifest.json
          cat apk-dist/SHA256SUMS
          (cd apk-dist && sha256sum -c SHA256SUMS)

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.preflight.outputs.source_ref }}"
          TAG="${TAG#refs/tags/}"
          VERSION="${{ needs.preflight.outputs.app_version }}"
          IS_RC="${{ needs.preflight.outputs.is_rc }}"
          echo "Publishing release for tag $TAG (is_rc=$IS_RC)"

          PRERELEASE_FLAG=""
          if [ "$IS_RC" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
            TITLE="EGA House Mobile $TAG (RC)"
          else
            TITLE="EGA House Mobile $TAG"
          fi

          NOTES="EGA House Mobile Delivery — tag $TAG
          - Source SHA: ${{ needs.preflight.outputs.source_sha }}
          - Version: $VERSION
          - Variant: release
          - Architectures: arm64-v8a,x86_64 (sideload; not Play Store universal)
          - API: ${{ needs.preflight.outputs.api_base_url }}
          - APK: $(cat apk-dist/SHA256SUMS)
          - Runner: blacksmith-2vcpu-ubuntu-2404"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — uploading assets"
            gh release upload "$TAG" apk-dist/*.apk apk-dist/release-manifest.json apk-dist/SHA256SUMS --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" $PRERELEASE_FLAG || true
          else
            echo "Creating release $TAG"
            gh release create "$TAG" apk-dist/*.apk apk-dist/release-manifest.json apk-dist/SHA256SUMS \
              --title "$TITLE" \
              --notes "$NOTES" \
              $PRERELEASE_FLAG
          fi
          gh release view "$TAG" --json url,assets --jq "{url: .url, assets: [.assets[].name]}"

  delivery-summary:
    name: Delivery summary
    needs: [preflight, build-apk, launch-smoke, publish-release]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Write delivery summary
        shell: bash
        run: |
          ARTIFACT_URL="${{ needs.build-apk.outputs.artifact_url }}"
          if [ -n "$ARTIFACT_URL" ]; then
            ARTIFACT_LINE="Artifact URL: $ARTIFACT_URL"
          else
            ARTIFACT_LINE="Artifact: ega-house-apk-${{ needs.preflight.outputs.source_sha }} (retention 1 day, download via Actions artifacts)"
          fi
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          # EGA ANDROID DELIVERY

          | Field | Value |
          |---|---|
          | Source SHA | \`${{ needs.preflight.outputs.source_sha }}\` |
          | Source ref | \`${{ needs.preflight.outputs.source_ref }}\` |
          | Version | \`${{ needs.preflight.outputs.app_version }}\` |
          | Variant | \`release\` |
          | Production API | \`${{ needs.preflight.outputs.api_base_url }}\` |
          | Architectures | \`arm64-v8a,x86_64\` |
          | Blacksmith runner | \`blacksmith-2vcpu-ubuntu-2404\` |
          | APK filename | \`${{ needs.build-apk.outputs.apk_filename }}\` |
          | APK SHA256 | \`${{ needs.build-apk.outputs.apk_sha256 }}\` |
          | Artifact ID | \`${{ needs.build-apk.outputs.artifact_id }}\` |
          | $ARTIFACT_LINE |  |
          | Artifact retention | \`1 day\` |

          | Gate | Result |
          |---|---|
          | Preflight | ${{ needs.preflight.result }} |
          | Unified CI exact SHA | ${{ needs.preflight.result }} |
          | Blacksmith APK build | ${{ needs.build-apk.result }} |
          | APK checksum | ${{ needs.launch-smoke.result }} |
          | Emulator boot | ${{ needs.launch-smoke.result }} |
          | ADB install | ${{ needs.launch-smoke.result }} |
          | Activity launch (am start -W) | ${{ needs.launch-smoke.result }} |
          | Process alive after 10s (pidof) | ${{ needs.launch-smoke.result }} |
          | GitHub Release | ${{ needs.publish-release.result }} |

          EOF
          if [ "${{ needs.launch-smoke.result }}" = "success" ]; then
            echo "ANDROID LAUNCH SMOKE = PASS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ANDROID LAUNCH SMOKE = FAIL" >> "$GITHUB_STEP_SUMMARY"
          fi
          cat "$GITHUB_STEP_SUMMARY"
