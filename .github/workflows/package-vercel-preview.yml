name: Package Vercel Preview Source

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch source
        uses: actions/checkout@v4

      - name: Upload source bundle
        uses: actions/upload-artifact@v4
        with:
          name: vercel-preview-source
          path: |
            .
            !.git/**
            !node_modules/**
            !.next/**
          include-hidden-files: true
          retention-days: 1
