# Full smoke suite: onboarding (+ relaunch persistence) → login → tasks visible
# → timer start/stop → logout.
#
# 00-onboarding.yaml runs on cleared state and fails if onboarding disappears or
# replays after relaunch, so the suite cannot pass while onboarding is broken.
# 01-login clears state again and its onboarding branch is conditional, so it
# tolerates either first-run or persisted state.
# Run with: maestro test -e EMAIL=... -e PASSWORD=... apps/mobile/e2e/maestro/suite.yaml
appId: com.ega_house.mobile
---
- runFlow: 00-onboarding.yaml
- runFlow: 01-login.yaml
- runFlow: 02-tasks-visible.yaml
- runFlow: 03-timer-start-stop.yaml
- runFlow: 04-logout.yaml
