# Journey 1 — login. Requires a live target, deployed API, and test account.
# First launch opens onboarding before welcome; the onboarding branch is
# conditional (see 00-welcome.yaml) so the flow also passes when the completion
# flag survives `clearState`.
appId: com.ega_house.mobile
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Skip.*|EGA.?HOUSE"
    timeout: 120000
- runFlow:
    when:
      visible: "Skip.*"
    commands:
      - tapOn: "Skip.*"
- extendedWaitUntil:
    visible: "Tasks, focus sessions.*"
    timeout: 60000
- tapOn: "Get started"
- assertVisible: "Login"
- tapOn:
    text: "Email"
- inputText: ${EMAIL}
- tapOn:
    text: "Password"
- inputText: ${PASSWORD}
- tapOn:
    text: "Login"
- assertVisible: "Tasks"
