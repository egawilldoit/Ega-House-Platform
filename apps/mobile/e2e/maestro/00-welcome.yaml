# Journey 0 — non-authenticated smoke: welcome screen renders, navigation to
# login works, login form renders. Needs only an installed APK + booted target
# (no API, no credentials), so it is the one flow CI can prove end-to-end.
#
# UI strings verified against apps/mobile/app/(public)/welcome.tsx ("Get
# started", "Sign in with your EGA House account") and login.tsx ("Login",
# placeholder texts "Email"/"Password"). Brand text renders as "EGA HOUSE" via
# textTransform, so it is asserted with a case-insensitive regex.
#
# First launch now opens onboarding (key `ega.mobile.onboarding.v1`) before
# welcome. The wait matches either screen and the onboarding branch is
# conditional so the flow still passes when the flag survives `clearState`
# (iOS keychain persistence).
#
# Maestro compiles every plain-text selector into textRegex and applies
# FULL-match semantics (dispatch runs 32661945230/32669157471: substrings like
# "Tasks, focus sessions" fail against "Tasks, focus sessions, and daily
# momentum - all in one place."). Multi-word/nested assertions therefore use
# explicit regexes that full-match the rendered text.
appId: com.ega_house.mobile
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Skip.*|EGA.?HOUSE"
    timeout: 120000
- runFlow:
    when:
      visible: "Skip.*"
    commands:
      - tapOn: "Skip.*"
- extendedWaitUntil:
    visible: "Tasks, focus sessions.*"
    timeout: 60000
- assertVisible: "Get started"
- assertVisible: "Sign in with your EGA House account"
- takeScreenshot: welcome-screen
- tapOn: "Get started"
- extendedWaitUntil:
    visible: "Login"
    timeout: 60000
- assertVisible: "Email"
- assertVisible: "Password"
- takeScreenshot: login-form
